# Netlify configuration — Tideward
[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Set STRICT = "1" once all business details are filled in, so a production
# build fails if a launch placeholder is ever reintroduced.
[context.production.environment]
  STRICT = "0"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://plausible.io; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self' https://plausible.io; frame-src https://www.google.com; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/thank-you/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/about-us"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/contact-us"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/self-directed-401-k"
  to = "/self-directed-401k/"
  status = 301

[[redirects]]
  from = "/solo-401-k"
  to = "/solo-401k/"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/privacy-policy/"
  status = 301

[[redirects]]
  from = "/terms-and-conditions"
  to = "/terms/"
  status = 301
